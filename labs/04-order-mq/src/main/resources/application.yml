spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3310/order_mq}
    username: ${DB_USERNAME:order_mq}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:order_mq}
    password: ${RABBITMQ_PASSWORD:}
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
