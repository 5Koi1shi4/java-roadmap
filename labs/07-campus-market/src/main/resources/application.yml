spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 101MB
      max-request-size: 101MB
  task:
    scheduling:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

campus:
  market:
    identity:
      allowed-domains: stu.example.edu.cn
      verification-secret: local-only-verification-secret-change-me-32
      verification-ttl: 10m
      verification-rate-limit: 60s
    jwt:
      secret: local-only-jwt-secret-change-me-32-bytes
      ttl: 15m
    mail:
      simulation-enabled: false
    search:
      dispatcher:
        enabled: false
        fixed-delay-ms: 1000
        cleanup-delay-ms: 5000

---
spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: local

campus:
  market:
    mail:
      simulation-enabled: true
    payment:
      simulation-enabled: true
