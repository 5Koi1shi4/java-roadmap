spring:
  application:
    name: identity-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  data:
    redis:
      repositories:
        enabled: false
      connect-timeout: 2s
      timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
  task:
    scheduling:
      enabled: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

campus:
  market:
    identity:
      allowed-domains: ${CAMPUS_MARKET_IDENTITY_ALLOWED_DOMAINS:stu.example.edu.cn}
      verification-secret: ${CAMPUS_MARKET_IDENTITY_VERIFICATION_SECRET:local-only-verification-secret-change-me-32}
      verification-ttl: 10m
      verification-rate-limit: 60s
    jwt:
      issuer: ${CAMPUS_MARKET_JWT_ISSUER:http://gateway.test}
      audience: ${CAMPUS_MARKET_JWT_AUDIENCE:campus-market-api}
      key-id: ${CAMPUS_MARKET_JWT_KEY_ID:identity-key-1}
      private-key: ${CAMPUS_MARKET_JWT_PRIVATE_KEY:}
      public-key: ${CAMPUS_MARKET_JWT_PUBLIC_KEY:}
    mail:
      smtp:
        host: ${CAMPUS_MARKET_SMTP_HOST:}
        port: ${CAMPUS_MARKET_SMTP_PORT:}
        username: ${CAMPUS_MARKET_SMTP_USERNAME:}
        password: ${CAMPUS_MARKET_SMTP_PASSWORD:}
        from: ${CAMPUS_MARKET_SMTP_FROM:}

---
spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

eureka:
  client:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
