spring:
  application:
    name: ai-support-service
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    openai:
      base-url: ${CAMPUS_MARKET_AI_BASE_URL:https://api.openai.com}
      api-key: ${CAMPUS_MARKET_AI_API_KEY:}
      timeout: 3s
      chat:
        options:
          model: ${CAMPUS_MARKET_AI_MODEL:gpt-4o-mini}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CAMPUS_MARKET_IDENTITY_JWKS_URI:http://localhost:18081/api/auth/.well-known/jwks.json}
          issuer-uri: ${CAMPUS_MARKET_JWT_ISSUER:http://gateway.test}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

campus:
  market:
    jwt:
      audience: ${CAMPUS_MARKET_JWT_AUDIENCE:campus-market-api}
    ai:
      enabled: ${CAMPUS_MARKET_AI_ENABLED:true}
      max-concurrency: ${CAMPUS_MARKET_AI_MAX_CONCURRENCY:8}
      max-response-bytes: ${CAMPUS_MARKET_AI_MAX_RESPONSE_BYTES:16384}
      policy-directory: ${CAMPUS_MARKET_AI_POLICY_DIRECTORY:policies}

---
spring:
  config:
    activate:
      on-profile: test
  ai:
    openai:
      api-key: ${CAMPUS_MARKET_AI_API_KEY:test-disabled}
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

campus:
  market:
    ai:
      enabled: ${CAMPUS_MARKET_AI_ENABLED:false}
