spring:
  application:
    name: ai-support-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CAMPUS_MARKET_IDENTITY_JWKS_URI:http://localhost:18081/api/auth/.well-known/jwks.json}
          issuer-uri: ${CAMPUS_MARKET_JWT_ISSUER:http://gateway.test}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

campus:
  market:
    jwt:
      audience: ${CAMPUS_MARKET_JWT_AUDIENCE:campus-market-api}

---
spring:
  config:
    activate:
      on-profile: test
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
