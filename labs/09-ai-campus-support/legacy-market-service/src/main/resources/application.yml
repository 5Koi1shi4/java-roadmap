spring:
  application:
    name: legacy-market-service
  elasticsearch:
    connection-timeout: ${CAMPUS_MARKET_ELASTICSEARCH_CONNECTION_TIMEOUT:2s}
    socket-timeout: ${CAMPUS_MARKET_ELASTICSEARCH_SOCKET_TIMEOUT:2s}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 101MB
      max-request-size: 101MB
  task:
    scheduling:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CAMPUS_MARKET_IDENTITY_JWKS_URI:http://localhost:18081/api/auth/.well-known/jwks.json}
          issuer-uri: ${CAMPUS_MARKET_JWT_ISSUER:http://gateway.test}
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,jwks,eureka
          show-components: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

campus:
  market:
    jwt:
      audience: campus-market-api
    search:
      dispatcher:
        enabled: false
        fixed-delay-ms: 1000
        cleanup-delay-ms: 5000
    product:
      publisher:
        enabled: ${CAMPUS_MARKET_PRODUCT_PUBLISHER_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration

eureka:
  client:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local

campus:
  market:
    payment:
      simulation-enabled: true
