spring:
  application:
    name: legacy-market-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 101MB
      max-request-size: 101MB
  task:
    scheduling:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CAMPUS_MARKET_IDENTITY_JWKS_URI:http://localhost:18081/api/auth/.well-known/jwks.json}
          issuer-uri: ${CAMPUS_MARKET_JWT_ISSUER:http://gateway.test}
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,jwks,eureka
          show-components: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

campus:
  market:
    jwt:
      audience: campus-market-api
    search:
      dispatcher:
        enabled: false
        fixed-delay-ms: 1000
        cleanup-delay-ms: 5000

---
spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration

eureka:
  client:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local

campus:
  market:
    payment:
      simulation-enabled: true
