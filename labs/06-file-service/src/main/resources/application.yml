file:
  max-size: 20MB
  upload-session-ttl: 1h
  staging-lease: 2m
  staging-wait-timeout: 5s
  staging-poll-interval: 100ms
  cleanup:
    batch-size: 50
    # 调度周期由部署配置覆盖，避免代码中固定扫描频率。
    schedule: 60000
    lease: 30s
    retry-delays: [5s, 30s, 2m, 10m]
    max-attempts: 5
    temporary-object-fallback-age: 24h
  download:
    max-link-ttl: 2m
    local-hmac-secret: ${FILE_LOCAL_HMAC_SECRET:}
  identity:
    trusted-header-enabled: false
  maintenance:
    enabled: false
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-root: ${FILE_LOCAL_ROOT:./data/files}
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:}
    minio-secret-key: ${MINIO_SECRET_KEY:}
    minio-bucket: ${MINIO_BUCKET:secure-files}
    minio-region: ${MINIO_REGION:us-east-1}
    minio-connect-timeout: ${MINIO_CONNECT_TIMEOUT:5s}
    minio-read-timeout: ${MINIO_READ_TIMEOUT:30s}
    minio-write-timeout: ${MINIO_WRITE_TIMEOUT:30s}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
