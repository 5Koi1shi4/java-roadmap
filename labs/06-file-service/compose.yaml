services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: secure_files
      MYSQL_USER: secure_files
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_files_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    ports: ["3312:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin-local}
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on:
      minio:
        condition: service_healthy
    ports: ["8666:8666", "8474:8474"]
  # The application must use http://toxiproxy:8666; this service creates the
  # data-plane route explicitly instead of relying on an endpoint variable.
  toxiproxy-init:
    image: curlimages/curl:8.10.1
    depends_on:
      toxiproxy:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl --fail --silent http://toxiproxy:8474/version; do sleep 1; done;
        if ! curl --fail --silent http://toxiproxy:8474/proxies/minio >/dev/null; then
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies
        -H 'Content-Type: application/json'
        -d '{"name":"minio","listen":"0.0.0.0:8666","upstream":"minio:9000","enabled":true}';
        fi
